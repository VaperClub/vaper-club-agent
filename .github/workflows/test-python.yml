name: test-python

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: mcp-server-python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m build
